name: Quality checks and gated GitHub Pages deployment
on:
  push:
    branches: [main, codex, develop, maintenance, upgrade]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compass-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      COMPASS_BASE_PATH: /${{ github.event.repository.name }}/
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Reproducible install
        run: npm ci
      - name: Verify contracts, app, and static build
        run: npm run verify
      - name: Browser and PDF smoke test
        timeout-minutes: 3
        env:
          COMPASS_PDF_PROOF: ${{ runner.temp }}/compass-proof
        run: node tests/browser-smoke.cjs
      - name: Check exported PDF text and render pages
        working-directory: ${{ runner.temp }}/compass-proof
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          pdftotext -layout synthetic-report.pdf extracted.txt
          grep -F 'AI Use-Case Guidance: Hold' extracted.txt
          grep -F 'sspark.net' extracted.txt
          if grep -E 'Consultant Review Template|small_sme|Cost class: C[0-9]' extracted.txt; then exit 1; fi
          pdftoppm -scale-to 860 -jpeg synthetic-report.pdf page
          sudo apt-get install -y --no-install-recommends python3-pil fonts-dejavu-core
          /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/review-pdf.py"
      - name: Retain synthetic report for visual inspection
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: synthetic-report-proof
          path: ${{ runner.temp }}/compass-proof
          retention-days: 7
      - name: Extended Python contract validation
        run: |
          python scripts/validate_product_v13.py
      - name: Upload built static artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node for live checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies for live PDF verification
        run: npm ci --omit=dev
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify the live assessment
        timeout-minutes: 3
        env:
          COMPASS_SMOKE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/browser-smoke.cjs
