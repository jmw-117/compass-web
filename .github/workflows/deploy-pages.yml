name: Quality checks and gated GitHub Pages deployment
on:
  pull_request:
    branches: [main, codex, develop, maintenance, upgrade]
  push:
    branches: [main, codex, develop, maintenance, upgrade]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the main-branch artifact after S7 release approval
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: compass-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Reproducible install
        run: npm ci
      - name: Verify contracts, app, and static build
        run: npm run verify
      - name: Extended Python contract validation
        run: |
          python scripts/validate_kit.py
          python scripts/validate_product_v13.py
      - name: Setup Pages
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload built static artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
